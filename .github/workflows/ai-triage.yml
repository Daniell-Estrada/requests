name: AI Triage - SQA-Triage Agent

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: 'Modelo NVIDIA NIM'
        type: string
        default: 'nvidia/nemotron-3-super-120b-a12b'

jobs:
  triage:
    runs-on: ubuntu-latest
    environment: TOKENS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run SQA-Triage Agent
        id: triage
        env:
          API_SONAR: ${{ secrets.API_SONAR }}
          API_NVIDIA: ${{ secrets.API_NVIDIA }}
          SONAR_PROJECT: 'daniell-estrada_requests'
          NVIDIA_MODEL: ${{ github.event.inputs.model || 'nvidia/nemotron-3-super-120b-a12b' }}
        run: python ai_triage.py

      - name: Upload Triage Result
        uses: actions/upload-artifact@v4
        with:
          name: triage-result
          path: triage_result.md
          retention-days: 30
